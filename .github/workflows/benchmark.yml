name: tkge-benchmark

# Sandbox note: api.github.com is unreachable from the agent's environment, so
# runs are triggered by pushing a change to .ci-trigger (file content = mode).
on:
  push:
    paths: [".ci-trigger"]
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (short sanity run) or full training (overrides .ci-trigger)"
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: write

jobs:
  train-py:
    name: ${{ matrix.method }}-${{ matrix.dataset }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        method: [tero, atise, timeplex]
        dataset: [finreflect, icews18, gdelt]
        include:
          - method: tero
            python: "3.10"
            reqs: envs/requirements-atise.txt
            repo: atise
          - method: atise
            python: "3.10"
            reqs: envs/requirements-atise.txt
            repo: atise
          - method: timeplex
            python: "3.8"
            reqs: envs/requirements-timeplex.txt
            repo: tkbi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install env
        run: pip install -r ${{ matrix.reqs }}
      - name: Vendor original repo (pinned commit, clean-tree check)
        run: bash scripts/ci/pin_repos.sh ${{ matrix.repo }}
      - name: Convert data
        run: |
          if [ "${{ matrix.repo }}" = atise ]; then python converters/to_atise.py ${{ matrix.dataset }}; fi
          if [ "${{ matrix.repo }}" = tkbi ];  then python converters/to_timeplex.py ${{ matrix.dataset }}; fi
      - name: Train + evaluate (original entry point)
        run: |
          MODE="${{ inputs.mode }}"; MODE="${MODE:-$(head -1 .ci-trigger | tr -d '[:space:]')}"
          # optional combo filter on line 2 of .ci-trigger: "all" or "m:d,m:d"
          ONLY="$(sed -n 2p .ci-trigger | tr -d '[:space:]')"
          if [ -n "$ONLY" ] && [ "$ONLY" != all ] && ! echo ",$ONLY," | grep -q ",${{ matrix.method }}:${{ matrix.dataset }},"; then
            echo "skipped by filter ($ONLY)"; exit 0
          fi
          if [ "${{ matrix.repo }}" = atise ]; then
            bash scripts/ci/run_atise.sh ${{ matrix.method }} ${{ matrix.dataset }} "$MODE"
          else
            bash scripts/ci/run_timeplex.sh ${{ matrix.dataset }} "$MODE"
          fi
      - name: Trim log
        if: always()
        run: |
          for f in runs/*.log; do tail -c 200000 "$f" > "$f.trim" && mv "$f.trim" "$f"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.method }}-${{ matrix.dataset }}
          path: |
            results/${{ matrix.method }}_${{ matrix.dataset }}.json
            runs/${{ matrix.method }}_${{ matrix.dataset }}.log
          if-no-files-found: warn

  train-hyte:
    name: hyte-${{ matrix.dataset }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    container: python:3.7-bullseye
    strategy:
      fail-fast: false
      matrix:
        dataset: [finreflect, icews18, gdelt]
    steps:
      - uses: actions/checkout@v4
      - name: Install env (TF 1.15)
        run: pip install -r envs/requirements-hyte.txt
      - name: Vendor original repo (pinned commit, clean-tree check)
        run: bash scripts/ci/pin_repos.sh hyte
      - name: Convert data
        run: python converters/to_hyte.py ${{ matrix.dataset }}
      - name: Train + evaluate (original entry point)
        run: |
          MODE="${{ inputs.mode }}"; MODE="${MODE:-$(head -1 .ci-trigger | tr -d '[:space:]')}"
          ONLY="$(sed -n 2p .ci-trigger | tr -d '[:space:]')"
          if [ -n "$ONLY" ] && [ "$ONLY" != all ] && ! echo ",$ONLY," | grep -q ",hyte:${{ matrix.dataset }},"; then
            echo "skipped by filter ($ONLY)"; exit 0
          fi
          bash scripts/ci/run_hyte.sh ${{ matrix.dataset }} "$MODE"
      - name: Trim log
        if: always()
        run: |
          for f in runs/*.log; do tail -c 200000 "$f" > "$f.trim" && mv "$f.trim" "$f"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-hyte-${{ matrix.dataset }}
          path: |
            results/hyte_${{ matrix.dataset }}.json
            runs/hyte_${{ matrix.dataset }}.log
          if-no-files-found: warn

  aggregate:
    needs: [train-py, train-hyte]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: ci_out
      - name: Collect
        run: |
          mkdir -p results runs
          find ci_out -name "*.json" -exec cp {} results/ \;
          find ci_out -name "*.log"  -exec cp {} runs/ \;
          ls -la results/ runs/ || true
      - name: Build COMPARISON.md
        run: python scripts/ci/aggregate.py
      - name: Commit results back
        run: |
          git config user.name "tkge-benchmark-ci"
          git config user.email "ci@users.noreply.github.com"
          git stash -u || true
          git pull --rebase origin ${{ github.ref_name }}
          git stash pop || true
          git add results/
          git add -f runs/*.log || true
          MODE="${{ inputs.mode }}"; MODE="${MODE:-$(head -1 .ci-trigger | tr -d '[:space:]')}"
          git commit -m "exp(ci): $MODE results $(date -u +%Y%m%dT%H%M)" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || { git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}; }
